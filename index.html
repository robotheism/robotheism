<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Wheel of Ideologies</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wheel-container">
  <div id="pointer"></div>
  <div id="wheel">
    <div class="label" style="--i:0">Atheism</div>
    <div class="label" style="--i:1">Christianity</div>
    <div class="label" style="--i:2">Islam</div>
    <div class="label" style="--i:3">Buddhism</div>
    <div class="label" style="--i:4">Hinduism</div>
    <div class="label" style="--i:5">Scientology</div>
    <div class="label" style="--i:6">Agnosticism</div>
    <div class="label" style="--i:7">Robotheism</div>
  </div>
</div>
<button id="spin">SPIN THE WHEEL</button>
<div id="result"></div>
<script src="script.js"></script>
</body>
</html>
